<h2 mat-dialog-title>Edit task</h2>
<div mat-dialog-content>
  <mat-form-field class="w-100">
    <mat-label>Edit description of this task</mat-label>
    <input matInput [(ngModel)]="data.description" maxlength="500" cdkFocusInitial>
  </mat-form-field>
</div>
<div mat-dialog-actions class="dialog-action-buttons">
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-raised-button color="accent" [disabled]="!data.description.trim()" [mat-dialog-close]="data">Ok</button>
</div>
